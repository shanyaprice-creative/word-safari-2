<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word Safari</title>
<style>
  body {
    margin: 0;
    font-family: 'Comic Sans MS', sans-serif;
    background: linear-gradient(#bfe6c9, #f4e6b0);
    text-align: center;
  }
  #game-container {
    position: relative;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    background-image: url('generated-image-6.png');
    background-size: cover;
    background-position: center;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  h1 {
    color: #2e5d34;
    text-shadow: 1px 1px 2px white;
    padding-top: 20px;
  }
  #animal-stage {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    padding: 30px 10px;
    flex-wrap: wrap;
  }
  .animal {
    width: 150px;
    transition: transform 0.3s;
    cursor: pointer;
  }
  .animal:hover {
    transform: scale(1.1);
  }
  .flip {
    transform: scaleX(-1);
  }
  #word-box {
    background: white;
    display: inline-block;
    padding: 15px 30px;
    border-radius: 12px;
    font-size: 28px;
    font-weight: bold;
    color: #444;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    margin-bottom: 30px;
  }
  #percy {
    width: 90px;
    position: absolute;
    bottom: 10px;
    right: 20px;
  }
</style>
</head>
<body>

<div id="game-container">
  <h1>🌿 Word Safari 🌿</h1>

  <div id="animal-stage">
    <img src="generated-image.png" alt="Zebra" class="animal" id="zebra" onclick="sayWord('Zebra')">
    <img src="generated-image-2.png" alt="Monkey" class="animal flip" id="monkey" onclick="sayWord('Monkey')">
    <img src="generated-image-3.png" alt="Lion" class="animal flip" id="lion" onclick="sayWord('Lion')">
    <img src="generated-image-4.png" alt="Elephant" class="animal" id="elephant" onclick="sayWord('Elephant')">
  </div>

  <div id="word-box">Tap an animal!</div>

  <img id="percy" src="generated-image-5.png" alt="Percy the Parrot">
</div>

<script>
function sayWord(word) {
  document.getElementById('word-box').innerText = word;
  const utterance = new SpeechSynthesisUtterance(word);
  utterance.rate = 0.9;
  speechSynthesis.speak(utterance);
}
</script>

</body>
</html>
